name: Workstream Review Gate

run-name: MacSteam Gate / phase=${{ inputs.phase }} / PR=${{ inputs.pr_number }} / HEAD=${{ inputs.expected_head }} / REPORT=${{ inputs.worker_report_comment_id }}

on:
  pull_request:
    branches:
      - feat/public-oss-bootstrap
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      phase:
        required: true
        type: choice
        options:
          - submission
          - review
      pr_number:
        required: true
        type: string
      expected_head:
        required: true
        type: string
        description: "Exact 40-character HEAD SHA to validate"
      worker_report_comment_id:
        required: true
        type: string
        description: "Exact issue comment ID of the canonical Worker report"

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read

jobs:
  advance:
    name: Advance Gate
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up gh CLI token
        run: echo "GH_TOKEN=${GITHUB_TOKEN}" >> "$GITHUB_ENV"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run workstage advance gate
        run: |
          python3 scripts/workstage-review-gate.py \
            --phase advance \
            --pr-number ${{ github.event.pull_request.number }} \
            --expected-head ${{ github.event.pull_request.head.sha }} \
            --repo ${{ github.repository }} \
            --policy .github/workstage-review-gate-policy.json

  submission:
    name: Submission Gate
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'submission'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.expected_head }}
          persist-credentials: false
      - name: Set up gh CLI token
        run: echo "GH_TOKEN=${GITHUB_TOKEN}" >> "$GITHUB_ENV"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run workstage submission gate
        run: |
          python3 scripts/workstage-review-gate.py \
            --phase submission \
            --pr-number ${{ inputs.pr_number }} \
            --expected-head ${{ inputs.expected_head }} \
            --repo ${{ github.repository }} \
            --policy .github/workstage-review-gate-policy.json \
            --worker-report-comment-id ${{ inputs.worker_report_comment_id }}

  review:
    name: Review Gate
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'review'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.expected_head }}
          persist-credentials: false
      - name: Set up gh CLI token
        run: echo "GH_TOKEN=${GITHUB_TOKEN}" >> "$GITHUB_ENV"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run workstage review gate
        run: |
          python3 scripts/workstage-review-gate.py \
            --phase review \
            --pr-number ${{ inputs.pr_number }} \
            --expected-head ${{ inputs.expected_head }} \
            --repo ${{ github.repository }} \
            --policy .github/workstage-review-gate-policy.json \
            --worker-report-comment-id ${{ inputs.worker_report_comment_id }}
