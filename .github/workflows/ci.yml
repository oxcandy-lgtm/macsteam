name: CI

on:
  pull_request:
    branches: [main, feat/public-oss-bootstrap]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Swift Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Swift build
        run: swift build
      - name: Swift test
        run: swift test

  audit:
    name: Public Audit
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate JSON Schemas
        run: |
          set -euo pipefail
          for schema in Contracts/*.schema.json; do
            python3 -m json.tool "$schema" >/dev/null
            echo "valid: $schema"
          done
      - name: Validate schema fixtures
        run: bash scripts/validate-fixtures.sh
      - name: Validate component-lock
        run: python3 scripts/validate-component-lock.py
      - name: Validate distribution gate
        run: bash scripts/distribution-gate.sh
      - name: License file validation
        run: |
          set -euo pipefail
          required=(
            Legal/COMPONENT_POLICY.md
            Legal/DISTRIBUTION_POLICY.md
            Legal/PROPRIETARY_COMPONENTS.md
            Legal/SOURCE_OFFER_POLICY.md
            Legal/TRADEMARK_POLICY.md
            THIRD_PARTY_NOTICES.md
            LICENSE
          )
          for f in "${required[@]}"; do
            if [ -f "$f" ]; then echo "present: $f"; else echo "MISSING: $f"; exit 1; fi
          done
      - name: Recipe security validation
        run: python3 scripts/validate-recipes.py
      - name: Run public audit
        run: bash scripts/public-audit.sh
      - name: U1R16 lifecycle audit
        run: bash scripts/u1r16-static-audit.sh
      - name: Test U1R16 audit
        run: bash scripts/test-u1r16-static-audit.sh

  license-validation:
    name: License Validation
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check LICENSE
        run: test -f LICENSE && head -1 LICENSE | grep -q "GNU"
      - name: Check THIRD_PARTY_NOTICES
        run: test -f THIRD_PARTY_NOTICES.md
      - name: SPDX headers
        run: |
          c=$(find Sources -name "*.swift" -exec grep -l "SPDX-License-Identifier: GPL-3.0-or-later" {} \; | wc -l)
          t=$(find Sources -name "*.swift" | wc -l)
          echo "SPDX headers: $c/$t"
          [ "$c" = "$t" ] || exit 1

  recipe-validation:
    name: Recipe Validation
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate recipe JSON
        run: |
          for f in Sources/MacSteam/Resources/Recipes/*.json; do
            python3 -m json.tool "$f" > /dev/null
            echo "valid: $f"
          done

  gitignore-validation:
    name: Gitignore Validation
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check .gitignore
        run: test -f .gitignore
      - name: Check forbidden patterns
        run: |
          ! find . -name ".DS_Store" 2>/dev/null | grep -q .
          ! find . -name "xcuserdata" -not -path "./.git/*" 2>/dev/null | grep -q .
